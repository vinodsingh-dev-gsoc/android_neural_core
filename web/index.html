<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent caching so we always get fresh code -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Location Dashboard</title>

    <!-- Leaflet CSS (jsdelivr has better CORS than unpkg) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous" />

    <!-- Leaflet JS (jsdelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
        crossorigin="anonymous"></script>

    <!-- Supabase JS (jsdelivr) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
        integrity="sha384-dl/4LkSyQ4uEucc48NM6VDZLAjLLq9yMzZ5JLXumBq7Ld33XBof73hseOqPhO89+"
        crossorigin="anonymous"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 14px;
            max-width: 280px;
        }
        .info-panel h3 { margin-bottom: 8px; color: #333; }
        .info-panel .stat { margin: 4px 0; }
        .refresh-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .refresh-btn:hover { background: #16a34a; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="info-panel">
        <h3>📍 Location Dashboard</h3>
        <div class="stat" id="lastLocation">Last location: --</div>
        <div class="stat" id="totalPoints">Points: --</div>
        <button class="refresh-btn" onclick="loadLocations()">Refresh</button>
    </div>

    <script>
        // Supabase credentials - base URL only (no /rest/v1/ suffix)
        const SUPABASE_URL = 'https://tbxfdqpmfkywcyyhrqxm.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRieGZkcXBtZmt5d2N5eWhycXhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTQwMjksImV4cCI6MjEwNzM5MDAyOX0.n6zytI-hGTM2vUdUoNFVQaMSfKp62TPn0Q1EMbkVxqU';

        // Initialize Supabase client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Initialize map
        let map = L.map('map').setView([20.5937, 78.9629], 5); // Center on India

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markers = [];

        async function loadLocations() {
            try {
                const { data, error } = await supabaseClient
                    .from('locations')
                    .select('lat, lon, created_at')
                    .order('created_at', { ascending: false })
                    .limit(500);

                if (error) {
                    console.error('Supabase error:', error);
                    document.getElementById('lastLocation').textContent = 'Error loading data';
                    return;
                }

                // Clear old markers
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                if (data.length === 0) {
                    document.getElementById('lastLocation').textContent = 'No locations yet';
                    document.getElementById('totalPoints').textContent = 'Points: 0';
                    return;
                }

                // Plot each location as a marker
                data.reverse().forEach((row, i) => {
                    const marker = L.circleMarker([row.lat, row.lon], {
                        radius: 5,
                        color: '#22c55e',
                        fillColor: '#22c55e',
                        fillOpacity: 0.7
                    }).addTo(map)
                    .bindPopup(`Point ${i + 1}<br/>${new Date(row.created_at).toLocaleString()}`);
                    markers.push(marker);
                });

                // Center on the latest location
                const latest = data[data.length - 1];
                map.setView([latest.lat, latest.lon], 13);

                // Update info panel
                const lastTime = new Date(data[0].created_at).toLocaleString();
                document.getElementById('lastLocation').textContent = 'Last: ' + lastTime;
                document.getElementById('totalPoints').textContent = 'Points: ' + data.length;
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('lastLocation').textContent = 'Fetch failed';
            }
        }

        // Auto-refresh every 30 seconds
        loadLocations();
        setInterval(loadLocations, 30000);
    </script>
</body>
</html>
